<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - Wanderlist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="site-nav">
        <nav class="container" aria-label="Main">
            <a class="brand" href="index.html">Wanderlist</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html">Log in</a></li>
                <li><a href="register.html" aria-current="page">Register</a></li>
            </ul>
        </nav>
    </header>

    <main class="auth-page">
        <section class="auth-aside" aria-labelledby="aside-title">
            <h1 id="aside-title">Start your list</h1>
            <p>Make an account to save countries, add trip notes, and track where you've been.</p>
        </section>

        <section class="auth-main">
            <div class="auth-box">
                <h2>Create account</h2>

                <form action="#" method="post">
                    <div class="field">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" autocomplete="username" minlength="3" required>
                    </div>

                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="name@school.edu" autocomplete="email"
                            required>
                        <span class="hint">We'll use this to verify your account.</span>
                    </div>

                    <div class="field">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" autocomplete="new-password" minlength="8"
                            required>
                        <span class="hint">Use at least 8 characters.</span>
                    </div>

                    <div class="field">
                        <label for="confirm-password">Confirm password</label>
                        <input type="password" id="confirm-password" name="confirm_password" autocomplete="new-password"
                            minlength="8" required>
                    </div>

                    <button type="submit" class="btn btn-block">Create account</button>
                </form>

                <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">Wanderlist &middot; IT 340 project</div>
    </footer>

</body>

</html>
