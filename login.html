<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in - Wanderlist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="site-nav">
        <nav class="container" aria-label="Main">
            <a class="brand" href="index.html">Wanderlist</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html" aria-current="page">Log in</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </nav>
    </header>

    <main class="auth-page">
        <section class="auth-aside" aria-labelledby="aside-title">
            <h1 id="aside-title">Welcome back</h1>
            <p>Your bucket list is where you left it. Log in to keep planning.</p>
        </section>

        <section class="auth-main">
            <div class="auth-box">
                <h2>Log in</h2>

                <form action="#" method="post">
                    <div class="field">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" autocomplete="username" required>
                    </div>

                    <div class="field">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" autocomplete="current-password" required>
                    </div>

                    <button type="submit" class="btn btn-block">Log in</button>
                </form>

                <p class="auth-switch">New here? <a href="register.html">Create an account</a></p>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">Wanderlist &middot; IT 340 project</div>
    </footer>

</body>

</html>
